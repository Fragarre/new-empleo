name: Diagnóstico búsqueda GVA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnostico-busqueda-gva.yml"
      - "diagnostico_busqueda_gva.py"
      - "decodo_proxy.py"

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GVA_PROXY_URL: ${{ secrets.GVA_PROXY_URL }}
      GVA_PROXY_USER: ${{ secrets.GVA_PROXY_USER }}
      GVA_PROXY_PASSWORD: ${{ secrets.GVA_PROXY_PASSWORD }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Ejecutar diagnóstico de solo lectura
        run: |
          python --version
          python diagnostico_busqueda_gva.py 2>&1 | tee diagnostico_busqueda_gva.txt
      - name: Guardar salida del diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-busqueda-gva
          path: diagnostico_busqueda_gva.txt
          if-no-files-found: warn
          retention-days: 7
